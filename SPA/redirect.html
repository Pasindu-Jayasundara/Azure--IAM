<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Azure / IAM - Signing in</title>
    <style>
        :root { color: #f8f5ee; background: #151515; font-family: Georgia, serif; }
        body { align-items: center; display: flex; justify-content: center; margin: 0; min-height: 100vh; }
        main { max-width: 420px; padding: 32px; text-align: center; }
        .mark { align-items: center; background: #f06b4f; color: #151515; display: inline-flex; font: 700 13px/1 Arial, sans-serif; height: 38px; justify-content: center; margin-bottom: 24px; width: 38px; }
        h1 { font-size: clamp(32px, 7vw, 54px); font-weight: 400; letter-spacing: -2px; margin: 0 0 14px; }
        p { color: #aaa49a; font: 15px/1.6 Arial, sans-serif; margin: 0; }
        .loader { background: #35332f; height: 2px; margin: 32px auto 0; overflow: hidden; width: 180px; }
        .loader::after { background: #f06b4f; content: ""; display: block; height: 100%; transform: translateX(-100%); animation: load 1.6s ease-in-out infinite; }
        @keyframes load { to { transform: translateX(180px); } }
    </style>
</head>
<body>
    <main>
        <span class="mark">AI</span>
        <h1>Preparing your workspace</h1>
        <p>Authentication is being completed securely. This window will close shortly.</p>
        <div class="loader" aria-hidden="true"></div>
    </main>
    <script type="module">
        import { broadcastResponseToMainFrame } from "@azure/msal-browser/redirect-bridge";

        broadcastResponseToMainFrame().catch((error) => {
            console.error("Error broadcasting response:", error);
        });
    </script>
</body>
</html>
